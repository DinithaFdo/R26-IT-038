[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-scope-backend"
version = "0.1.0"
description = "FastAPI backend for the MULTI-SCOPE deepfake voice classification system."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.140.0,<0.141.0",
    "uvicorn>=0.51.0,<0.52.0",
    "pydantic>=2.13.0,<2.14.0",
    "pydantic-settings>=2.14.0,<2.15.0",
    "python-multipart>=0.0.32,<0.0.33",
    "numpy>=2.4.0,<2.5.0",
    "pymongo[srv]>=4.11.0,<4.12.0",
    "PyJWT[crypto]>=2.8.0,<2.9.0",
    "httpx>=0.28.0,<0.29.0",
    "cloudinary>=1.40.0,<1.41.0",
]

[project.optional-dependencies]
# Required only when a branch runs in `real` mode. Kept out of the base
# dependency set so a dummy/disabled deployment does not pull a ~200 MB wheel.
# `transformers` is required only for the ssl_sequence branch (loads the
# frozen XLS-R backbone by name via Hugging Face Hub). `mamba-ssm` and
# `causal-conv1d` are intentionally NOT listed here: both ship CUDA-only
# build backends and fail to install on a non-CUDA target (confirmed: their
# setup.py crashes probing torch.version.cuda when it is None). The SSL
# branch's Mamba blocks are a pure-PyTorch reimplementation of the same
# published algorithm instead -- see app/models/architectures/xlsr_mamba.py.
models = [
    "torch>=2.6,<3",
    "transformers>=4.46,<5",
]
xai = [
    "xgboost==3.2.0",
    "shap==0.52.0",
    "librosa==0.11.0",
    # ``kaiser_fast`` resampling in the v4 notebook-compatible feature recipe
    # uses librosa's optional resampy backend.
    "resampy==0.4.3",
    "praat-parselmouth==0.4.7",
    "joblib>=1.3,<2",
    # The hash-pinned semantic imputer and the Glottal logistic-regression
    # pipeline were both trained and serialized with scikit-learn 1.6.1.
    # Pickled scikit-learn estimators are not forward-compatible guarantees,
    # so keep their inference runtime exact rather than relying on warnings.
    "scikit-learn==1.6.1",
]
# Required only when GLOTTAL_MODEL_MODE=real. Kept out of the base dependency
# set (and out of "models") because DisVoice pulls in a large transitive
# stack (tensorflow, matplotlib, pandas, numba, ...) via its own phonation/
# phonological/prosody/articulation submodules, none of which the Glottal
# branch actually uses -- only disvoice.glottal.glottal.Glottal is imported,
# lazily, from app/models/preprocessing/glottal_v1.py.
#
# `setuptools<81` is a genuine compatibility pin, not an arbitrary one:
# disvoice's `pysptk` dependency still does `import pkg_resources` at import
# time (disvoice/glottal/GCI.py -> pysptk.util); setuptools >=81 no longer
# ships that module at all (ModuleNotFoundError, not just the deprecation
# warning setuptools 81-<removal> would print). See
# app/models/real/glottal_compat.py for the other DisVoice/NumPy-2
# compatibility shims this branch needs at runtime.
glottal = [
    "scikit-learn==1.6.1",
    "joblib>=1.3,<2",
    "scipy>=1.11,<2",
    "librosa>=0.10,<1",
    "soundfile>=0.12,<1",
    "praat-parselmouth>=0.4,<1",
    "disvoice>=0.1.10,<0.2",
    "setuptools<81",
]
dev = [
    "pytest>=9.1.0,<9.2.0",
]
integration-test = [
    "pytest>=9.1.0,<9.2.0",
]
mcp = [
    "mcp>=1.2.0,<1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration and not network and not mongodb and not cloudinary'"
markers = [
    "unit: hermetic unit tests",
    "integration: tests that require external services",
    "ffmpeg: tests that require local ffmpeg/ffprobe binaries",
    "mongodb: tests that require a real MongoDB service",
    "cloudinary: tests that require real Cloudinary credentials",
    "network: tests that intentionally perform external network access",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*"]
exclude = ["tests*", "docker*"]
