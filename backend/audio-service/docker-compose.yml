# Development stack. Start from audio-service with: docker compose up --build
services:
  backend:
    image: multiscope-audio-development:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: &audio-environment
      APP_ENV: development
      DEBUG: ${COMPOSE_DEBUG:-true}
      HOST: 0.0.0.0
      PORT: 8000
      MONGODB_URI: ${COMPOSE_MONGODB_URI:-mongodb://mongodb:27017/multiscope}
      MONGODB_DATABASE: ${COMPOSE_MONGODB_DATABASE:-multiscope}
      MONGODB_REQUIRED: "true"
      STORAGE_POLICY: ${COMPOSE_STORAGE_POLICY:-${STORAGE_POLICY:-optional}}
      CLOUDINARY_STORAGE_ENABLED: ${COMPOSE_CLOUDINARY_STORAGE_ENABLED:-${CLOUDINARY_STORAGE_ENABLED:-false}}
      ALLOWED_ORIGINS: ${COMPOSE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      UPLOAD_DIR: /tmp/multiscope/uploads
      FFMPEG_BINARY: ffmpeg
      FFPROBE_BINARY: ffprobe
      MODEL_ROOT_DIR: /var/lib/multiscope/model_artifacts
      CNN_MODEL_MODE: ${COMPOSE_CNN_MODEL_MODE:-real}
      AASIST_MODEL_MODE: ${COMPOSE_AASIST_MODEL_MODE:-real}
      SSL_MODEL_MODE: ${COMPOSE_SSL_MODEL_MODE:-real}
      GLOTTAL_MODEL_MODE: ${COMPOSE_GLOTTAL_MODEL_MODE:-real}
      REQUIRED_MODEL_BRANCHES: ${COMPOSE_REQUIRED_MODEL_BRANCHES:-lfcc_cnn_tcn,aasist,ssl_sequence,glottal}
      MODEL_DEVICE_POLICY: cpu
      MODEL_DEFAULT_DEVICE: cpu
      # Windows host caches are not automatically available inside Linux containers.
      HF_HOME: /var/cache/huggingface
      SSL_XLSR_LOCAL_FILES_ONLY: ${COMPOSE_SSL_XLSR_LOCAL_FILES_ONLY:-false}
      XAI_ENABLED: ${COMPOSE_XAI_ENABLED:-true}
      XAI_MODE: ${COMPOSE_XAI_MODE:-real}
      XAI_ARTIFACT_ROOT: /var/lib/multiscope/xai-artifacts
      # Other XAI paths, credentials, and optional narrative settings come from .env.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10).read()"
      interval: 30s
      timeout: 15s
      retries: 3
      # Allow first-run backbone download and real-model initialization.
      start_period: 300s
    volumes: &audio-volumes
      - xai-artifacts:/var/lib/multiscope/xai-artifacts
      - huggingface-cache:/var/cache/huggingface
      - type: bind
        source: ./model_artifacts
        target: /var/lib/multiscope/model_artifacts
        read_only: true
        bind:
          create_host_path: false
      # Source changes are picked up by DEBUG=true / run.py auto reload.
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./run.py:/app/run.py:ro
      - ./runtime_guard.py:/app/runtime_guard.py:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./mcp_server:/app/mcp_server:ro

  # Optional stdio adapter: docker compose --profile mcp run --rm -T mcp
  mcp:
    profiles: [mcp]
    image: multiscope-audio-development:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *audio-environment
      DEBUG: "false"
    command: [python, -m, mcp_server.server]
    stdin_open: true
    tty: false
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      disable: true
    volumes: *audio-volumes

  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb-data:
  xai-artifacts:
  huggingface-cache:
