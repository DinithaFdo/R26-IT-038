<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MULTI-SCOPE">
  <title>MULTI-SCOPE</title>
  <rect width="32" height="32" rx="6" fill="#000000"/>
  <!--
    Multi-branch waveform: four bars of differing height represent the four
    classifier branches, the tallest highlighted in the brand green-yellow to
    stand for the fused decision.
  -->
  <rect x="6"  y="13" width="3" height="6"  rx="1.5" fill="#ffffff"/>
  <rect x="11" y="9"  width="3" height="14" rx="1.5" fill="#ffffff"/>
  <rect x="16" y="6"  width="3" height="20" rx="1.5" fill="#95f625"/>
  <rect x="21" y="11" width="3" height="10" rx="1.5" fill="#ffffff"/>
</svg>
